<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="256" height="256" rx="40" ry="40" fill="#1e1e1e"></rect>

  <!-- Rust-ish gear/hex outline -->
  <polygon points="128,28 196,64 196,136 128,172 60,136 60,64" fill="none" stroke="#dea584" stroke-width="12" stroke-linejoin="round"></polygon>

  <!-- Inner monad "box in a box" -->
  <rect x="88" y="88" width="80" height="80" rx="16" ry="16" fill="none" stroke="#f5f5f5" stroke-width="5"></rect>
  <rect x="102" y="102" width="52" height="52" rx="12" ry="12" fill="none" stroke="#dea584" stroke-width="4"></rect>

  <!-- Lambda symbol -->
  <text x="128" y="138" text-anchor="middle" dominant-baseline="middle" font-size="70" font-family="monospace" fill="#f5f5f5">λ</text>

  <!-- >>= for monadic bind -->
  <text x="128" y="200" text-anchor="middle" font-size="26" font-family="monospace" fill="#dea584">&gt;&gt;=</text>

  <!-- Small "effect" spark -->
  <circle cx="176" cy="84" r="5" fill="#ffdd55"></circle>
  <circle cx="176" cy="84" r="10" fill="none" stroke="#ffdd55" stroke-width="2"></circle>
</svg>
